[package]
name = "renderer-abi"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
ryu = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "generate"
path = "src/bin/generate.rs"
