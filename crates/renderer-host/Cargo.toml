[package]
name = "renderer-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "renderer_host"

[[bin]]
name = "renderer-host-probe"
path = "src/bin/renderer-host-probe.rs"

[dependencies]
deno_core = "=0.411.0"
renderer-abi = { package = "oxideloop-renderer-abi", path = "../renderer-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "time"] }

[lints]
workspace = true
