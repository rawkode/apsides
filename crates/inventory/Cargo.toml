[package]
name = "inventory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["sqlite-backend"]
sqlite-backend = ["dep:rusqlite", "dep:tokio"]

[dependencies]
async-trait = "0.1"
compiler-core = { path = "../compiler-core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[dev-dependencies]
hyper = { version = "=0.14.32", default-features = false, features = ["server"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "=0.25.0"

[lints]
workspace = true
