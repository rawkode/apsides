[package]
name = "inventory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["libsql-backend"]
libsql-backend = ["dep:libsql"]

[dependencies]
async-trait = "0.1"
libsql = { version = "=0.9.30", default-features = false, features = ["core", "remote", "tls"], optional = true }
compiler-core = { path = "../compiler-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
