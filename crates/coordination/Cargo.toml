[package]
name = "coordination"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["libsql-backend"]
libsql-backend = [
  "dep:hyper",
  "dep:hyper-rustls",
  "dep:libsql",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tower",
  "dep:url",
]

[dependencies]
async-trait = "0.1"
compiler-core = { path = "../compiler-core" }
deploy = { path = "../deploy" }
hyper = { version = "=0.14.32", default-features = false, features = ["client", "http1", "tcp"], optional = true }
hyper-rustls = { version = "=0.25.0", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"], optional = true }
libsql = { version = "=0.9.30", default-features = false, features = ["core", "remote", "tls"], optional = true }
rustls = { version = "=0.22.4", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-native-certs = { version = "=0.7.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower = { version = "=0.4.13", default-features = false, features = ["filter"], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
inventory = { path = "../inventory" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
