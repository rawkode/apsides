[package]
name = "test-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
compiler-core = { path = "../compiler-core" }
container = { path = "../container" }
hmac = "0.12"
http = "1"
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ws"] }
platform = { path = "../platform" }
runtime = { path = "../runtime" }
release = { path = "../release" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
