[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Phase 5a spike gate (see the Apsides v0.3 plan, "Phase 5 -> 5a. Spike
# gate"): this crate exists separately from `runtime` because
# `runtime/src/lib.rs` carries
# `#![forbid(unsafe_code)]` (forbid, not deny — it cannot be locally
# re-allowed by any module) and documents "This crate deliberately has no
# JavaScript engine." Embedding deno_core/V8 requires one unavoidable unsafe
# call site (`v8::new_rust_allocator`), so it is confined here instead, in
# `src/v8_alloc.rs`, under the workspace's `unsafe_code = "deny"` policy
# (deny, not forbid), with a module-level `#[allow(unsafe_code)]` and
# justification per the workspace hard rule.
[dependencies]
# Pinned exact: deno_core 0.412.0 is the newest release on crates.io as of
# this spike (2026-09-24) whose declared MSRV is compatible with the
# workspace's rust-toolchain.toml (1.98.0). deno_core itself declares no
# explicit rust-version in this release; its `v8` (published as `deno_v8`,
# re-exporting the `v8`/rusty_v8 crate) dependency pins to `v8 150.4.0`,
# which also has no stated MSRV floor above 1.98. Exact-pinned (not `^`) so a
# transitive V8 bump cannot silently change flag/ABI behavior validated here.
deno_core = "=0.412.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 5b `op_apsides_fetch`: promoted from dev-dependencies (Phase 5a used
# these only in tests/common/mod.rs's `https_get_via_hickory` spike helper).
# hickory-resolver: explicit-nameserver DNS resolution (no glibc
# getaddrinfo/`/etc/resolv.conf`) so a resolved address can be vetted before
# connecting; rustls/tokio-rustls/webpki-roots: a dedicated TLS client
# config (compiled-in root store, no native OS trust store, no client
# auth), never the OS proxy/trust configuration.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
landlock = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# Local HTTPS test-server fixture for the `op_apsides_fetch` "allowed"
# tests only (tests/common/https_fixture.rs): generates a throwaway
# self-signed CA + leaf certificate in-process. Default features
# (`crypto`, `pem`, `ring`) match the `ring` crypto backend already chosen
# for `rustls`/`tokio-rustls` above; no other TLS/crypto backend is pulled
# in. rcgen's own `[target."cfg(unix)".dev-dependencies]` on `openssl` (used
# only to build *rcgen's own* examples, never a dependency of the `rcgen`
# library target or anything that reaches this crate) was checked against
# rcgen 0.14.10's upstream `rcgen/Cargo.toml` before adding this.
rcgen = "0.14"

# `harness = false`: this binary's `fn main()` controls thread creation
# order itself (Landlock deny-all on the main thread, *then* V8 platform
# init, *then* the tokio runtime -- see the file for why), which libtest's
# default per-`#[test]`-thread harness would not let it guarantee.
[[test]]
name = "landlock_order"
path = "tests/landlock_order.rs"
harness = false

[lints]
workspace = true
