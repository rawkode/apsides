[package]
name = "acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "acceptance-prepare"
path = "src/main.rs"

[[bin]]
name = "acceptance-reproduce"
path = "src/bin/reproduce.rs"

[dependencies]
base64 = "0.22"
compiler-core = { path = "../compiler-core" }
coordination = { path = "../coordination" }
deploy = { path = "../deploy" }
http = "1"
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ws"] }
platform = { path = "../platform", features = ["deployer"] }
release = { path = "../release" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
test-cluster = { path = "../test-cluster" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[lints]
workspace = true
