[package]
name = "oxideloop-controller-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
oxideloop-bundle-archive = { path = "../bundle-archive" }
oxideloop-bundle-contract = { path = "../bundle-contract" }
oxideloop-controller-core = { path = "../controller-core" }
oxideloop-controller-api = { path = "../controller-api" }
oxideloop-event-planner = { path = "../event-planner" }
oxideloop-kube-transport = { path = "../kube-transport" }
oxideloop-mutation-model = { path = "../mutation-model" }
oxideloop-renderer-abi = { path = "../renderer-abi" }
oxideloop-renderer-protocol = { path = "../renderer-protocol" }
oxideloop-renderer-client = { path = "../renderer-client" }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
