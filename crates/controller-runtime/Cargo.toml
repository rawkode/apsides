[package]
name = "controller-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
test-failpoints = ["dep:rustix", "kube-transport/bootstrap-diagnostics"]

[[bin]]
name = "oxideloop-e2e-failpoint-control"
path = "src/bin/oxideloop-e2e-failpoint-control.rs"
required-features = ["test-failpoints"]

[dependencies]
bundle-archive = { path = "../bundle-archive" }
bundle-contract = { path = "../bundle-contract" }
controller-core = { path = "../controller-core" }
controller-api = { path = "../controller-api" }
event-planner = { path = "../event-planner" }
kube-transport = { path = "../kube-transport" }
mutation-model = { path = "../mutation-model" }
renderer-abi = { path = "../renderer-abi" }
renderer-protocol = { path = "../renderer-protocol" }
renderer-client = { path = "../renderer-client" }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
rustix = { version = "1", optional = true, features = ["event", "fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
kube-transport = { path = "../kube-transport", features = ["test-support"] }
http = "1"
http-body-util = "0.1"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
