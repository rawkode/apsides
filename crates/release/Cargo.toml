[package]
name = "release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
compiler-core = { path = "../compiler-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros"] }
thiserror = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"
oci-spec = { version = "0.10", default-features = false, features = ["image"] }
# Sigstore verification without its aws-lc backend: crypto.rs supplies ring,
# the workspace's cryptographic library.
ring = "0.17"
sigstore-verify = { version = "=0.15.1", default-features = false }
spki = "0.7"

[dev-dependencies]
test-sigstore = { path = "../test-sigstore" }

[lints]
workspace = true
