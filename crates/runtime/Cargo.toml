[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "rustls-tls"] }
compiler-core = { path = "../compiler-core" }
deploy = { path = "../deploy" }
engine = { path = "../engine" }
platform = { path = "../platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The handler-egress DNS resolver (`engine::EgressResolver::new`) takes a
# `hickory_resolver::config::ResolverConfig`, a type `engine` does not
# re-export -- see the Apsides v0.3 plan, Phase 5b. Same version as `engine`
# itself pins, so this resolves to the identical crate in the lockfile
# rather than a second copy.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
