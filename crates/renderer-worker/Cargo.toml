[package]
name = "renderer-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "renderer_worker"

[[bin]]
name = "renderer-worker"
path = "src/main.rs"

[dependencies]
bundle-contract = { path = "../bundle-contract" }
renderer-abi = { path = "../renderer-abi" }
renderer-protocol = { path = "../renderer-protocol" }
renderer-host = { path = "../renderer-host" }
thiserror = "2"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
