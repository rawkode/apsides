[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aps"
path = "src/main.rs"

[features]
distribution = []

[dependencies]
compiler-core = { path = "../compiler-core" }
packaging = { path = "../packaging" }
release = { path = "../release" }
platform = { path = "../platform", features = ["deployer"] }
deploy = { path = "../deploy" }
inventory = { path = "../inventory" }
coordination = { path = "../coordination" }
test-cluster = { path = "../test-cluster" }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "config"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# `tests/events_example.rs` runs `examples/events`' compiled handler bundle
# through the same engine the generated controller embeds, against
# `engine::test_support::HttpsFixtureServer`. `engine` is already in this
# crate's graph (through `test-cluster` -> `runtime`); `test-util` only adds
# the fixture server.
engine = { path = "../engine", features = ["test-util"] }

[lints]
workspace = true
