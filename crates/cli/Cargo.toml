[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aps"
path = "src/main.rs"

[features]
distribution = []

[dependencies]
compiler-core = { path = "../compiler-core" }
release = { path = "../release" }
platform = { path = "../platform", features = ["deployer"] }
deploy = { path = "../deploy" }
inventory = { path = "../inventory" }
coordination = { path = "../coordination" }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "config"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
