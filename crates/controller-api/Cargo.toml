[package]
name = "oxideloop-controller-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["derive"] }
oxideloop-renderer-abi = { path = "../renderer-abi" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
oxideloop-renderer-protocol = { path = "../renderer-protocol" }

[lints]
workspace = true

[[bin]]
name = "generate-controller-api"
path = "src/bin/generate.rs"
