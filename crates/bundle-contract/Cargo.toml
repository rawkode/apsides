[package]
name = "oxideloop-bundle-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cap-std = "3"
cap-fs-ext = "3"
oxideloop-renderer-abi = { path = "../renderer-abi" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }

[dev-dependencies]
renderer-host = { path = "../renderer-host" }
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "generate-bundle-contract"
path = "src/bin/generate.rs"
