name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Hosted runners have about 14 GB free. Debug info and incremental caches
# for every crate and feature set filled it before the docs build.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.56.1/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo 'afb1d712a2a405f25804b60c30c418144c195dc157f70bb9aa5b73c95dd461bf  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Build CLI
        run: cuenv task build
      - name: Check authoring types and tests
        run: |
          cuenv task authorCheck
          cuenv task authorTest
          cuenv task authorCompilerTest
          cuenv task authorCompilerCheck
      - name: Check CNPG editor completion
        run: cuenv task authoringEditorCheck
      - name: Check aps diff against the CNPG examples
        run: cuenv task surfaceDiffCheck
      - name: Run Rust tests
        run: |
          cuenv task registryTest
          cuenv task runtimeTest
          cuenv task releaseTest
          cuenv task coordinationTest
          cuenv task inventoryTest
          cuenv task compilerCoreTest
          cuenv task testClusterTest
      - name: Run Rust lints
        run: |
          cuenv task registryCheck
          cuenv task runtimeCheck
          cuenv task releaseCheck
          cuenv task coordinationCheck
          cuenv task inventoryCheck
          cuenv task compilerCoreCheck
          cuenv task testClusterCheck
          cuenv task acceptanceCheck
      - name: Run packaging script tests
        run: cuenv task packagingTest
      - name: Build documentation
        run: cuenv task docsBuild
  reactor:
    # Builds the web-application fixture release with `aps build` and runs
    # every generated reactor case on a disposable kind cluster.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # scripts/rusty_v8.py never caches under the checkout (that would be
    # gitignored `work/`, but also wrong in principle: an installed CLI
    # distribution's equivalent path is the asset tree
    # crates/cli/src/assets.rs hash-verifies in full); this names the same
    # directory the cache step below persists.
    env:
      APSIDES_RUSTY_V8_CACHE: ${{ runner.temp }}/rusty-v8-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.56.1/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo 'afb1d712a2a405f25804b60c30c418144c195dc157f70bb9aa5b73c95dd461bf  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      - name: Install kind
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          echo 'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
      # `aps build` fetches the pinned rusty_v8 archive itself (scripts/
      # rusty_v8.py, before the --network=none Cargo build); caching it
      # avoids a ~40 MB re-download every run. Keyed on pins.json, so a pin
      # bump fetches fresh instead of serving a stale entry. Path matches
      # this job's APSIDES_RUSTY_V8_CACHE above.
      - name: Cache the pinned rusty_v8 archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APSIDES_RUSTY_V8_CACHE }}
          key: rusty-v8-${{ hashFiles('scripts/rusty-v8/pins.json') }}
      # `aps build` and `aps test --cluster` never pull: the builder, runtime
      # base, fixture base, kind node and proxy images must already be local.
      - name: Pull pinned images
        run: |
          for image in \
            rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922 \
            "$(cat scripts/runtime-base/reference)" \
            bash:5.2.37@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324 \
            kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48 \
            nginxinc/nginx-unprivileged:alpine@sha256:d9083fe47768377ef55dedafd67d4da7c2f2bc2bece7554954f29359deb0dce9
          do
            docker pull --quiet "$image"
          done
      - name: Run reactor cases on a kind cluster
        run: cuenv task reactorClusterTest
      # Results, JUnit, controller logs and object diagnostics only; the
      # cluster's kubeconfig lives in a private temporary directory.
      - name: Upload reactor results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reactor-results
          path: work/reactor/results
          if-no-files-found: ignore
          retention-days: 7
  acceptance-prepare:
    # Builds and signs the releases the acceptance scenarios deploy, once,
    # and hands them with the `aps` that built them to the scenario jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # scripts/rusty_v8.py never caches under the checkout (that would be
    # gitignored `work/`, but also wrong in principle: an installed CLI
    # distribution's equivalent path is the asset tree
    # crates/cli/src/assets.rs hash-verifies in full); this names the same
    # directory the cache step below persists.
    env:
      APSIDES_RUSTY_V8_CACHE: ${{ runner.temp }}/rusty-v8-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.56.1/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo 'afb1d712a2a405f25804b60c30c418144c195dc157f70bb9aa5b73c95dd461bf  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # `aps build` fetches the pinned rusty_v8 archive itself (scripts/
      # rusty_v8.py, before the --network=none Cargo build); caching it
      # avoids a ~40 MB re-download every run. Keyed on pins.json, so a pin
      # bump fetches fresh instead of serving a stale entry. Path matches
      # this job's APSIDES_RUSTY_V8_CACHE above.
      - name: Cache the pinned rusty_v8 archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APSIDES_RUSTY_V8_CACHE }}
          key: rusty-v8-${{ hashFiles('scripts/rusty-v8/pins.json') }}
      # `aps build` never pulls: the builder and runtime base images must
      # already be local.
      - name: Pull pinned build images
        run: |
          for image in \
            rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922 \
            "$(cat scripts/runtime-base/reference)"
          do
            docker pull --quiet "$image"
          done
      - name: Build and sign the releases
        run: cuenv task acceptancePrepare
      # Only what the scenarios read: inputs.json names these paths, and a tar
      # keeps the executable bit an artifact upload would drop. No private
      # key is left: prepare deletes it once the releases are signed.
      - name: Pack the prepared inputs
        run: |
          tar -cf "$RUNNER_TEMP/acceptance-inputs.tar" target/debug/aps \
            work/acceptance/inputs.json work/acceptance/trust-policy.json \
            work/acceptance/cnpg-operator.yaml \
            work/acceptance/initial/release work/acceptance/successor/release \
            work/acceptance/cleanup/release work/acceptance/owner/release
      - name: Upload the prepared inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-inputs
          path: ${{ runner.temp }}/acceptance-inputs.tar
          if-no-files-found: error
          retention-days: 1
  acceptance:
    # Deploys the prepared releases with the public `aps deploy`, each
    # scenario on its own disposable kind cluster: the CNPG upgrade and
    # ceiling (P0), uncertain writer termination, ownership collision and
    # live preview; every interrupted upgrade phase; last-type cleanup with a
    # finalizer and a replaced UID; and the runtime credential with platform
    # image pull secrets (docs/reference/ACCEPTANCE.md).
    needs: acceptance-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenarios: [Upgrade, Phases, Cleanup, Credentials]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.56.1/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo 'afb1d712a2a405f25804b60c30c418144c195dc157f70bb9aa5b73c95dd461bf  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install kind
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          echo 'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
      # The kind cluster never pulls its node image. The images the platform
      # and the examples pin (Envoy, curl, CNPG, PostgreSQL, PostgREST) are
      # pulled into the node by digest during the run, because saving them
      # from this runner's overlay2 image store would change their digests.
      - name: Pull the pinned kind node image
        run: docker pull --quiet kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
      - name: Download the prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-inputs
          path: ${{ runner.temp }}
      - name: Unpack the prepared inputs
        run: tar -xf "$RUNNER_TEMP/acceptance-inputs.tar"
      - name: Run the acceptance scenarios on kind
        run: cuenv task acceptance${{ matrix.scenarios }}Test
      # Scenarios delete their clusters; this removes any a cancelled run
      # left behind.
      - name: Delete leftover acceptance clusters
        if: always()
        shell: bash
        run: |
          clusters=$(kind get clusters 2>/dev/null || true)
          for name in $clusters; do
            case "$name" in
              aps-acc-*) kind delete cluster --name "$name" ;;
            esac
          done
      # Reports, aps output, controller logs and allowlisted diagnostics only,
      # all redacted; kubeconfigs and the inventory database stay in private
      # temporary directories.
      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-results-${{ matrix.scenarios }}
          path: work/acceptance/results
          if-no-files-found: ignore
          retention-days: 7
