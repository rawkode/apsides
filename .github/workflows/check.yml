name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.55.0/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo '8a80ea159e4da110be292e2bb1d17ef110ee9036fa28e969d07065e652086164  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: rustup show active-toolchain
      - name: Build CLI
        run: cuenv task build
      - name: Check authoring types and tests
        run: |
          cuenv task authorCheck
          cuenv task authorTest
          cuenv task authorCompilerTest
      - name: Check CNPG editor completion
        run: cuenv task authoringEditorCheck
      - name: Run Rust tests
        run: |
          cuenv task registryTest
          cuenv task runtimeTest
          cuenv task releaseTest
      - name: Run qualification harness unit tests
        run: |
          cuenv task cnpgDemoTest
          cuenv task cnpgCliDemoTest
          cuenv task cnpgCleanupTest
          cuenv task apiGapProbesTest
          cuenv task performanceResourcesTest
      - name: Build documentation
        run: cuenv task docsBuild
  tsx-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/tsx-controller
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run check
      - name: Run tests
        run: bun test
      - name: Build executable
        run: bun run build
      - name: Run packaging smoke test
        run: bun run smoke
  tsx-prototype-e2e:
    needs: tsx-prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototypes/tsx-controller
    env:
      TSX_E2E_CLUSTER: tsx-${{ github.run_id }}-${{ github.run_attempt }}
      TSX_E2E_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned kind and kubectl
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          curl --fail --silent --show-error --location \
            https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl \
            --output "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location \
            https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256 \
            --output "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run pinned kind acceptance
        run: bun run e2e
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tsx-prototype-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            prototypes/tsx-controller/.e2e/${{ env.TSX_E2E_CLUSTER }}-*/result.json
            prototypes/tsx-controller/.e2e/${{ env.TSX_E2E_CLUSTER }}-*/source-sha256.json
            prototypes/tsx-controller/.e2e/${{ env.TSX_E2E_CLUSTER }}-*/plan.json
            prototypes/tsx-controller/.e2e/${{ env.TSX_E2E_CLUSTER }}-*/*.log
      - name: Delete CI kind cluster
        if: always()
        shell: bash
        run: kind delete cluster --name "$TSX_E2E_CLUSTER" || true
