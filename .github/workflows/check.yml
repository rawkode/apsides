name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.55.0/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo '8a80ea159e4da110be292e2bb1d17ef110ee9036fa28e969d07065e652086164  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: rustup show active-toolchain
      - name: Build CLI
        run: cuenv task build
      - name: Check authoring types and tests
        run: |
          cuenv task authorCheck
          cuenv task authorTest
          cuenv task authorCompilerTest
      - name: Check CNPG editor completion
        run: cuenv task authoringEditorCheck
      - name: Run Rust tests
        run: |
          cuenv task registryTest
          cuenv task runtimeTest
          cuenv task releaseTest
      - name: Run qualification harness unit tests
        run: |
          cuenv task cnpgDemoTest
          cuenv task cnpgCleanupTest
          cuenv task apiGapProbesTest
          cuenv task performanceResourcesTest
      - name: Build documentation
        run: cuenv task docsBuild
