name: Nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Hosted runners have podman as well; the jobs pull images with docker, so
  # kind and the test runners must use Docker's store.
  APSIDES_CONTAINER_ENGINE: docker
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  reproducible-build:
    # Builds examples/web-application twice with `aps build --cache disabled`
    # and requires identical outputs, file for file: binary, OCI archive,
    # SBOM, IR, plan and build inputs (docs/reference/ACCEPTANCE.md). The
    # compile half runs in the checks workflow on every change.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.56.1/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo 'afb1d712a2a405f25804b60c30c418144c195dc157f70bb9aa5b73c95dd461bf  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # `aps build` never pulls: the builder and runtime base images must
      # already be local.
      - name: Pull pinned build images
        run: |
          for image in \
            rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922 \
            "$(cat scripts/runtime-base/reference)"
          do
            docker pull --quiet "$image"
          done
      - name: Build twice and compare
        run: cuenv task reproducibleBuild
      - name: Upload the comparison report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-build-report
          path: work/reproducible-build/report.json
          if-no-files-found: ignore
          retention-days: 14
  engine-parity:
    # Builds examples/web-application once with Docker and once with podman,
    # both with `aps build --cache disabled`, and requires identical outputs
    # apart from the engine each records as a host tool in its build inputs
    # (docs/reference/ACCEPTANCE.md). The runner ships both engines.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Each pinned image is held twice, once in each engine's store, on top
      # of two full builds.
      - name: Free preinstalled toolchains this job does not use
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby /usr/local/.ghcup /opt/az
          df -h /
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.56.1/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo 'afb1d712a2a405f25804b60c30c418144c195dc157f70bb9aa5b73c95dd461bf  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # `aps build` never pulls: the builder and runtime base images must
      # already be in each engine's store. podman is given the builder's
      # fully qualified name so the pull never depends on the runner's
      # short-name configuration.
      - name: Pull pinned build images into both engines
        run: |
          builder=rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
          runtime=$(cat scripts/runtime-base/reference)
          docker pull --quiet "$builder"
          docker pull --quiet "$runtime"
          podman pull --quiet "docker.io/library/$builder"
          podman pull --quiet "$runtime"
      # The engine of each build is set by the task itself, overriding the
      # workflow's APSIDES_CONTAINER_ENGINE.
      - name: Build with Docker and podman and compare
        run: cuenv task engineParityBuild
      - name: Upload the comparison report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-parity-report
          path: work/engine-parity/report.json
          if-no-files-found: ignore
          retention-days: 14
