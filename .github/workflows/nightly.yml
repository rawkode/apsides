name: Nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  reproducible-build:
    # Builds examples/web-application twice with `aps build --cache disabled`
    # and requires identical outputs, file for file: binary, OCI archive,
    # SBOM, IR, plan and build inputs (docs/reference/ACCEPTANCE.md). The
    # compile half runs in the checks workflow on every change.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Install cuenv
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cuenv/cuenv/releases/download/0.55.0/cuenv-linux-x64 \
            --output "$RUNNER_TEMP/cuenv"
          echo '8a80ea159e4da110be292e2bb1d17ef110ee9036fa28e969d07065e652086164  '"$RUNNER_TEMP/cuenv" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cuenv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # cuenv's fixed 10 second evaluation limit also covers downloading the
      # cuenv schema module into an empty cache. Fetch it first with the cue
      # CLI, which has no such limit.
      - name: Fetch CUE module dependencies
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cue-lang/cue/releases/download/v0.17.1/cue_v0.17.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/cue.tar.gz"
          echo 'a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369  '"$RUNNER_TEMP/cue.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cue.tar.gz" -C "$RUNNER_TEMP" cue
          "$RUNNER_TEMP/cue" mod tidy --check
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # `aps build` never pulls: the builder and runtime base images must
      # already be local.
      - name: Pull pinned build images
        run: |
          for image in \
            rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922 \
            "$(cat scripts/runtime-base/reference)"
          do
            docker pull --quiet "$image"
          done
      - name: Build twice and compare
        run: bash .github/cuenv-task.sh reproducibleBuild
      - name: Upload the comparison report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-build-report
          path: work/reproducible-build/report.json
          if-no-files-found: ignore
          retention-days: 14
