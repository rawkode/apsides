[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/compiler-core",
    "crates/coordination",
    "crates/deploy",
    "crates/inventory",
    "crates/platform",
    "crates/release",
    "crates/runtime",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rawkode/apsides"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
